name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PySide6 pyinstaller
      - name: Build AnyPS5Launcher.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AnyPS5Launcher
          --icon anyps5-launcher.ico
          --add-data "anyps5-launcher.svg;."
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia
          launcher.py
      - name: Smoke test (imports only)
        run: python -c "import ast; ast.parse(open('launcher.py', encoding='utf-8').read())"
      - uses: actions/upload-artifact@v4
        with:
          name: AnyPS5Launcher-windows
          path: dist/AnyPS5Launcher.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyPS5Launcher.exe
